<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Word Crush</title>

<style>
  .glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .neon-glow {
    box-shadow: 0 0 20px rgba(73, 75, 214, 0.2);
  }
  .neon-glow-active {
    box-shadow: 0 0 20px rgba(68, 226, 205, 0.4);
    border-color: rgba(68, 226, 205, 0.8);
  }
  .progress-gradient {
    background: linear-gradient(90deg, #c0c1ff, #44e2cd);
  }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden pt-16 pb-20 md:pb-0">
<!-- TopAppBar (Hidden Navigation Shell due to task focus, keeping header structure for game info) -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-white/15 shadow-[0_0_20px_rgba(73,75,214,0.2)] flex justify-between items-center px-margin-mobile h-16 md:hidden">
<div class="flex items-center gap-xs">
<button class="p-2 rounded-full hover:opacity-80 transition-opacity active:scale-95 text-primary">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="font-display-lg text-display-lg bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary absolute left-1/2 -translate-x-1/2 text-2xl">
      Level 4
    </div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary">pause</span>
</div>
</header>
<header class="hidden md:flex fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-white/15 shadow-[0_0_20px_rgba(73,75,214,0.2)] justify-between items-center px-margin-desktop max-w-7xl mx-auto h-16">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:opacity-80 transition-opacity active:scale-95 text-primary flex items-center">
<span class="material-symbols-outlined mr-2">arrow_back</span> Back
        </button>
</div>
<div class="font-display-lg text-display-lg bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
          Lumina Lexicon
      </div>
<div class="flex items-center gap-4">
<div class="glass-card px-4 py-1 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm">stars</span>
<span class="font-title-md text-title-md text-secondary">2,450</span>
</div>
</div>
</header>
<!-- Main Game Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-lg max-w-3xl mx-auto w-full gap-md mt-4 md:mt-16">
<!-- Game HUD -->
<div class="w-full flex flex-col gap-sm">
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Score</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-secondary">1,250</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Time</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-error font-mono">01:30</span>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-3 bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full progress-gradient rounded-full w-3/4 transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Puzzle Grid -->
<div class="w-full grid grid-cols-4 gap-xs md:gap-sm mt-md aspect-square md:aspect-video max-h-[600px]">
<!-- Block 1: English -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center break-words text-on-surface">Persistence</span>
</button>
<!-- Block 2: Chinese (Selected state) -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow-active bg-secondary-container/10 transition-all duration-200 active:scale-95 transform scale-105">
<span class="font-title-md text-title-md text-center text-secondary">堅持不懈</span>
</button>
<!-- Block 3 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">Ambition</span>
</button>
<!-- Block 4 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">Resilience</span>
</button>
<!-- Block 5 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">抱負</span>
</button>
<!-- Block 6: English (Selected state) -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow-active bg-secondary-container/10 transition-all duration-200 active:scale-95 transform scale-105">
<span class="font-title-md text-title-md text-center text-secondary">Endeavor</span>
</button>
<!-- Block 7 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">努力</span>
</button>
<!-- Block 8 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">恢復力</span>
</button>
<!-- Block 9 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">Courage</span>
</button>
<!-- Block 10 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95 opacity-0 invisible">
<!-- Matched block empty space -->
</button>
<!-- Block 11 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95 opacity-0 invisible">
<!-- Matched block empty space -->
</button>
<!-- Block 12 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">勇氣</span>
</button>
<!-- Block 13 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">Wisdom</span>
</button>
<!-- Block 14 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">智慧</span>
</button>
<!-- Block 15 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">Patience</span>
</button>
<!-- Block 16 -->
<button class="glass-card rounded-lg flex items-center justify-center p-2 neon-glow hover:opacity-80 transition-all duration-200 active:scale-95">
<span class="font-title-md text-title-md text-center text-on-surface">耐心</span>
</button>
</div>
<!-- Desktop Controls -->
<div class="hidden md:flex justify-center gap-md mt-lg w-full">
<button class="glass-card px-8 py-3 rounded-full flex items-center gap-2 hover:bg-surface-container transition-colors text-primary active:scale-95">
<span class="material-symbols-outlined">lightbulb</span>
<span class="font-title-md text-title-md">Hint (3)</span>
</button>
<button class="glass-card px-8 py-3 rounded-full flex items-center gap-2 hover:bg-surface-container transition-colors text-on-surface active:scale-95">
<span class="material-symbols-outlined">pause</span>
<span class="font-title-md text-title-md">Pause</span>
</button>
</div>
</main>
<!-- Mobile Bottom Control Bar (Replaces standard BottomNavBar for task focus) -->
<div class="md:hidden fixed bottom-0 w-full z-50 bg-surface-container/90 backdrop-blur-xl border-t border-white/10 p-margin-mobile pb-safe flex justify-around items-center">
<button class="flex flex-col items-center justify-center text-primary hover:opacity-80 transition-opacity active:scale-90 gap-1">
<span class="material-symbols-outlined text-2xl">lightbulb</span>
<span class="font-label-sm text-label-sm">Hint (3)</span>
</button>
<button class="flex items-center justify-center bg-primary text-on-primary rounded-full w-14 h-14 shadow-[0_0_20px_rgba(192,193,255,0.4)] active:scale-90 transition-transform">
<span class="material-symbols-outlined text-3xl">play_arrow</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-90 gap-1">
<span class="material-symbols-outlined text-2xl">settings</span>
<span class="font-label-sm text-label-sm">Options</span>
</button>
</div>
</body></html>
