<html lang="zh-TW"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {

                      "surface-dim": "#cbdbf5",

                      "primary-container": "#2563eb",

                      "on-secondary": "#ffffff",
                      "secondary-container": "#6cf8bb",
                      "inverse-surface": "#213145",
                      "surface-container-highest": "#d3e4fe",
                      "secondary": "#006c49",
                      "surface-bright": "#f8f9ff",
                      "on-background": "#0b1c30",
                      "surface-tint": "#0053db",
                      "on-secondary-container": "#00714d",
                      "secondary-fixed": "#6ffbbe",
                      "surface-container-high": "#dce9ff",
                      "tertiary-fixed-dim": "#ffb95f",
                      "on-tertiary-fixed": "#2a1700",
                      "surface": "#f8f9ff",
                      "error-container": "#ffdad6",
                      "error": "#ba1a1a",
                      "outline-variant": "#c3c6d7",
                      "tertiary": "#784b00",
                      "on-primary-fixed-variant": "#003ea8",
                      "on-primary": "#ffffff",
                      "on-tertiary-container": "#ffeedd",
                      "on-tertiary": "#ffffff",

                      "inverse-on-surface": "#eaf1ff",

                      "primary-fixed": "#dbe1ff",
                      "on-surface": "#0b1c30",

                      "on-error-container": "#93000a",
                      "on-secondary-fixed-variant": "#005236",
                      "inverse-primary": "#b4c5ff",

              "borderRadius": {

              "fontFamily": {

              },

<style>
        body { background-color: #f8f9ff; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom card selection styling */
        .identity-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 1px solid #c3c6d7; /* outline-variant */
            background-color: #ffffff; /* surface-container-lowest */
        }
        
        .identity-card:hover {
            background-color: #eff4ff; /* surface-container-low */
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .identity-card.selected {
            border-color: #004ac6; /* primary */
            background-color: #e5eeff; /* surface-container */
            box-shadow: 0 4px 12px rgba(0, 74, 198, 0.1);
        }
        
        .identity-card.selected .material-symbols-outlined {
            color: #004ac6; /* primary */
            font-variation-settings: 'FILL' 1;
        }
        
        .identity-card.selected .card-title {
            color: #004ac6; /* primary */
            font-weight: 600;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center p-container-padding text-on-surface">
<!-- Top Navigation Placeholder (suppressed per rules for linear transactional screens) -->
<main class="w-full max-w-lg mx-auto flex flex-col">
<!-- Header Section -->
<header class="text-center mb-section-margin">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">
                歡迎來到你的兩千字旅程
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                請選擇你目前的身份，我們將為你量身打造學習內容。
            </p>
</header>
<!-- Identity Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap mb-section-margin" id="identityGrid">
<!-- Elementary School -->
<div class="identity-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center text-center gap-3" data-identity="elementary" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">child_care</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">國小生</span>
</div>
<!-- Junior High -->
<div class="identity-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center text-center gap-3" data-identity="junior" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">backpack</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">國中生</span>
</div>
<!-- Senior High -->
<div class="identity-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center text-center gap-3" data-identity="senior" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">school</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">高中生</span>
</div>
<!-- University -->
<div class="identity-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center text-center gap-3" data-identity="university" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">account_balance</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">大學生</span>
</div>
<!-- Professional -->
<div class="identity-card rounded-xl p-card-inner-padding flex flex-col items-center justify-center text-center gap-3 md:col-span-2 md:w-1/2 md:mx-auto" data-identity="professional" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">work</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">社會人士</span>
</div>
</div>
<!-- Action Button -->
<div class="w-full mt-auto pb-safe">
<button class="w-full h-14 bg-outline-variant text-on-surface-variant font-headline-md text-headline-md rounded-xl transition-colors duration-200 cursor-not-allowed" disabled="" id="confirmBtn">
                確認
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.identity-card');
            const confirmBtn = document.getElementById('confirmBtn');
            let selectedIdentity = null;

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove selected class from all
                    cards.forEach(c => c.classList.remove('selected'));
                    
                    // Add selected class to clicked
                    card.classList.add('selected');
                    selectedIdentity = card.dataset.identity;
                    
                    // Enable button
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('bg-outline-variant', 'text-on-surface-variant', 'cursor-not-allowed');
                    confirmBtn.classList.add('bg-primary', 'text-on-primary', 'cursor-pointer', 'hover:bg-on-primary-fixed-variant');
                });
                
                // Keyboard accessibility
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        card.click();
                    }
                });
            });

            confirmBtn.addEventListener('click', () => {
                if(selectedIdentity) {
                    console.log('Confirmed identity:', selectedIdentity);
                    // Handle navigation to main app
                }
            });
        });
    </script>
</body></html>
