<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory Challenge - Lumina Lexicon</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#434655",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#2563eb",
                        "background": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#6cf8bb",
                        "inverse-surface": "#213145",
                        "surface-container-highest": "#d3e4fe",
                        "secondary": "#006c49",
                        "surface-bright": "#f8f9ff",
                        "on-background": "#0b1c30",
                        "surface-tint": "#0053db",
                        "on-secondary-container": "#00714d",
                        "secondary-fixed": "#6ffbbe",
                        "surface-container-high": "#dce9ff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-tertiary-fixed": "#2a1700",
                        "surface": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "outline-variant": "#c3c6d7",
                        "tertiary": "#784b00",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#ffeedd",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "tertiary-container": "#996100",
                        "on-tertiary-fixed-variant": "#653e00",
                        "tertiary-fixed": "#ffddb8",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-secondary-fixed": "#002113",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#00174b",
                        "on-primary-container": "#eeefff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container": "#e5eeff",
                        "primary-fixed": "#dbe1ff",
                        "on-surface": "#0b1c30",
                        "primary": "#004ac6",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#005236",
                        "inverse-primary": "#b4c5ff",
                        "outline": "#737686",
                        "surface-container-low": "#eff4ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-margin": "32px",
                        "unit": "8px",
                        "card-inner-padding": "24px",
                        "container-padding": "20px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "reading-zh": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-word": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "reading-zh": ["20px", { "lineHeight": "1.6", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "fontWeight": "700" }],
                        "display-word": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.outline-variant');
        }

        .level-1-card {
            background-color: theme('colors.surface-container-lowest');
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid theme('colors.outline-variant');
        }

        .level-2-interactive {
            background-color: theme('colors.surface-container-lowest');
            box-shadow: 0 10px 15px -3px rgba(0, 74, 198, 0.06), 0 4px 6px -2px rgba(0, 74, 198, 0.03);
            border: 1px solid theme('colors.outline-variant');
            transition: all 0.2s ease-in-out;
        }
        
        .level-2-interactive:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 74, 198, 0.1), 0 10px 10px -5px rgba(0, 74, 198, 0.04);
        }

        /* Ambient animated background pattern */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: radial-gradient(circle at 15% 50%, theme('colors.surface-container-highest') 0%, transparent 50%),
                              radial-gradient(circle at 85% 30%, theme('colors.primary-fixed') 0%, transparent 50%);
            opacity: 0.4;
            animation: pulse-bg 15s ease-in-out infinite alternate;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Safe area padding for bottom nav */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col pt-16 pb-24 md:pb-0">
<div class="ambient-bg"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface dark:bg-background shadow-sm docked full-width">
<button aria-label="Menu" class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed">Lumina Lexicon</h1>
<button aria-label="Streak" class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-200">
<span class="material-symbols-outlined text-tertiary-fixed-dim" data-icon="local_fire_department" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-container-padding py-section-margin w-full max-w-5xl mx-auto">
<!-- Screen Header -->
<div class="w-full mb-section-margin text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Memory Challenge</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Reinforce yesterday's vocabulary through play.</p>
</div>
<!-- High Score Bento Box (Asymmetric placement) -->
<div class="w-full max-w-md mb-section-margin">
<div class="glass-card rounded-xl p-card-inner-padding flex items-center justify-between relative overflow-hidden">
<div class="absolute -right-4 -top-4 w-24 h-24 bg-secondary-container rounded-full opacity-20 mix-blend-multiply filter blur-xl"></div>
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-1">Current High Score</h3>
<div class="font-display-word text-display-word text-primary flex items-baseline gap-2">
<span>12,450</span>
<span class="font-label-caps text-label-caps text-secondary font-bold">PTS</span>
</div>
</div>
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl" data-icon="emoji_events">emoji_events</span>
</div>
</div>
</div>
<!-- Mini-Game Options Grid -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-stack-gap md:gap-8">
<!-- Game 1: Letter Finder -->
<button class="level-2-interactive rounded-xl p-card-inner-padding flex flex-col items-center text-center group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed to-transparent opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
<!-- Game Icon / Illustration area -->
<div class="w-32 h-32 mb-6 rounded-full bg-surface-container flex items-center justify-center relative shadow-inner">
<div class="absolute inset-0 rounded-full border-4 border-white/50 border-dashed animate-[spin_20s_linear_infinite]"></div>
<span class="material-symbols-outlined text-5xl text-primary" data-icon="find_in_page">find_in_page</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2 group-hover:text-primary transition-colors">Letter Finder</h3>
<p class="font-reading-zh text-reading-zh text-on-surface-variant mb-6">尋找遺失字母</p>
<div class="mt-auto w-full">
<div class="h-14 w-full bg-tertiary rounded-lg flex items-center justify-center font-label-caps text-label-caps text-on-tertiary uppercase tracking-wider hover:bg-tertiary-container transition-colors shadow-sm">
                        Start Game
                    </div>
</div>
</button>
<!-- Game 2: Word Crush -->
<button class="level-2-interactive rounded-xl p-card-inner-padding flex flex-col items-center text-center group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-bl from-secondary-fixed to-transparent opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
<!-- Game Icon / Illustration area -->
<div class="w-32 h-32 mb-6 rounded-full bg-surface-container-highest flex items-center justify-center relative shadow-inner">
<div class="absolute -inset-2 bg-secondary-fixed-dim/20 rounded-full blur-md group-hover:blur-xl transition-all"></div>
<span class="material-symbols-outlined text-5xl text-secondary" data-icon="view_comfy">view_comfy</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2 group-hover:text-secondary transition-colors">Word Crush</h3>
<p class="font-reading-zh text-reading-zh text-on-surface-variant mb-6">單字消消樂</p>
<div class="mt-auto w-full">
<div class="h-14 w-full bg-tertiary rounded-lg flex items-center justify-center font-label-caps text-label-caps text-on-tertiary uppercase tracking-wider hover:bg-tertiary-container transition-colors shadow-sm">
                        Start Game
                    </div>
</div>
</button>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface dark:bg-background pb-safe border-t border-outline-variant dark:border-outline shadow-lg docked full-width">
<!-- Home - Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-container-low dark:hover:bg-surface-container-lowest transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<!-- Learn - Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-container-low dark:hover:bg-surface-container-lowest transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="school">school</span>
<span class="font-label-caps text-label-caps">Learn</span>
</a>
<!-- Games - ACTIVE -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl p-2 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="videogame_asset" data-weight="fill" style="font-variation-settings: 'FILL' 1;">videogame_asset</span>
<span class="font-label-caps text-label-caps">Games</span>
</a>
<!-- Community - Inactive -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-container-low dark:hover:bg-surface-container-lowest transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-label-caps text-label-caps">Community</span>
</a>
</nav>
<!-- Desktop SideNav/TopNav Links (Hidden on Mobile, placeholder for standard layout) -->
<div class="hidden md:flex fixed top-0 right-0 h-16 items-center pr-container-padding z-50 gap-4">
<a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors px-3 py-2" href="#">Home</a>
<a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors px-3 py-2" href="#">Learn</a>
<a class="text-primary font-label-caps text-label-caps font-bold px-3 py-2 border-b-2 border-primary" href="#">Games</a>
<a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors px-3 py-2" href="#">Community</a>
</div>
</body></html>
