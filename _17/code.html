<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);

        .glow-active {
            box-shadow: 0 0 20px rgba(73, 75, 214, 0.2);
        }

            border-color: #44e2cd;
            background: rgba(68, 226, 205, 0.1);
        }
        
        .incorrect-glow {
            box-shadow: 0 0 20px rgba(255, 180, 171, 0.4);
            border-color: #ffb4ab;
            background: rgba(255, 180, 171, 0.1);
        }
        
        .letter-tile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .letter-tile:active {
            transform: scale(0.95);
        }

        .pulse-subtle {
            animation: pulse-subtle 3s infinite;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        
        /* Floating particles effect container */

            left: 0;

<!-- Bottom Nav Anchor (Shared Component) - Rendered but inactive styled for focused task screen, or suppressed based on logic. 
         Following the Semantic Shell Mandate: "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action that implies a temporary departure from the main navigation flow -> Automatic Suppression."
         Therefore, the BottomNavBar is NOT rendered here. -->
<script>
        // Simple micro-interaction scripts for the letter tiles
        document.querySelectorAll('.letter-tile:not(.pointer-events-none)').forEach(button => {
            button.addEventListener('click', function() {
                // Remove base classes
                this.classList.remove('glass-panel', 'hover:bg-surface-variant/50', 'hover:border-primary/50', 'text-on-surface');
                
                // Randomly assign correct or incorrect for demonstration
                const isCorrect = Math.random() > 0.5;
                
                if (isCorrect) {
                    this.classList.add('correct-glow', 'text-secondary');
                    // Find active empty slot and fill it
                    const activeSlot = document.querySelector('.border-primary');
                    if (activeSlot) {
                        activeSlot.textContent = this.textContent;
                        activeSlot.classList.remove('border-primary', 'text-primary', 'shadow-[0_4px_10px_-2px_rgba(192,193,255,0.4)]', 'pulse-subtle', 'bg-primary/5');
                        activeSlot.classList.add('border-outline-variant', 'text-on-surface');
                        
                        // Move focus to next empty slot
                        const nextSlot = Array.from(document.querySelectorAll('.text-on-surface-variant')).find(el => el.textContent === '_');
                        if (nextSlot) {
                            nextSlot.classList.remove('text-on-surface-variant');
                            nextSlot.classList.add('border-primary', 'text-primary', 'shadow-[0_4px_10px_-2px_rgba(192,193,255,0.4)]', 'pulse-subtle', 'bg-primary/5');
                        }
                    }
                } else {
                    this.classList.add('incorrect-glow', 'text-error', 'opacity-50');
                }
                
                this.classList.add('pointer-events-none');
            });
        });
    </script>
