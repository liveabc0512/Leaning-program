<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.outline-variant');
        }

        .level-1-card {
            background-color: theme('colors.surface-container-lowest');
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid theme('colors.outline-variant');
        }

        .level-2-interactive {
            background-color: theme('colors.surface-container-lowest');
            box-shadow: 0 10px 15px -3px rgba(0, 74, 198, 0.06), 0 4px 6px -2px rgba(0, 74, 198, 0.03);
            border: 1px solid theme('colors.outline-variant');
            transition: all 0.2s ease-in-out;
        }
        
        .level-2-interactive:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 74, 198, 0.1), 0 10px 10px -5px rgba(0, 74, 198, 0.04);
        }

        /* Ambient animated background pattern */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: radial-gradient(circle at 15% 50%, theme('colors.surface-container-highest') 0%, transparent 50%),
                              radial-gradient(circle at 85% 30%, theme('colors.primary-fixed') 0%, transparent 50%);
            opacity: 0.4;
            animation: pulse-bg 15s ease-in-out infinite alternate;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Safe area padding for bottom nav */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pt-16 pb-24 md:pb-0">
<div class="ambient-bg"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface dark:bg-background shadow-sm docked full-width">
<button aria-label="Menu" class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed">Lumina Lexicon</h1>

<span class="material-symbols-outlined text-tertiary-fixed-dim" data-icon="local_fire_department" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-container-padding py-section-margin w-full max-w-5xl mx-auto">
<!-- Screen Header -->
<div class="w-full mb-section-margin text-center"><h2 class="font-display-word text-display-word text-on-surface mb-2">Puzzle Hub</h2><p class="font-body-md text-body-md text-on-surface-variant">Master your vocabulary through daily challenges</p></div>
<!-- High Score Bento Box (Asymmetric placement) -->
<div class="w-full mb-6"><div class="flex items-center justify-between mb-4"><h3 class="font-headline-md text-headline-md text-on-surface">Daily Review</h3><span class="font-label-caps text-label-caps text-primary bg-primary-fixed px-3 py-1 rounded-full">Day 2+ Active</span></div><div class="grid grid-cols-1 gap-4"><button class="level-2-interactive rounded-xl p-4 flex items-center gap-4 group"><div class="w-16 h-16 rounded-lg bg-primary-container flex items-center justify-center text-on-primary shadow-sm"><span class="material-symbols-outlined text-3xl">find_in_page</span></div><div class="flex-grow text-left"><h4 class="font-headline-md text-on-surface">Letter Finder</h4><p class="font-reading-zh text-on-surface-variant text-sm">尋找遺失字母</p><div class="w-full bg-surface-container-high h-1.5 rounded-full mt-2"><div class="bg-primary h-full rounded-full w-3/4"></div></div></div><div class="text-right"><div class="font-label-caps text-primary font-bold">BEST</div><div class="font-display-word text-xl text-primary">12k</div></div></button></div></div>
<!-- Mini-Game Options Grid -->
<div class="w-full grid grid-cols-1 gap-4"><button class="level-2-interactive rounded-xl p-4 flex items-center gap-4 group"><div class="w-16 h-16 rounded-lg bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm"><span class="material-symbols-outlined text-3xl">view_comfy</span></div><div class="flex-grow text-left"><h4 class="font-headline-md text-on-surface">Word Crush</h4><p class="font-reading-zh text-on-surface-variant text-sm">單字消消樂</p><div class="w-full bg-surface-container-high h-1.5 rounded-full mt-2"><div class="bg-secondary h-full rounded-full w-1/2"></div></div></div><div class="text-right"><div class="font-label-caps text-secondary font-bold">BEST</div><div class="font-display-word text-xl text-secondary">8.4k</div></div></button><button class="level-2-interactive rounded-xl p-4 flex items-center gap-4 group"><div class="w-16 h-16 rounded-lg bg-tertiary-fixed flex items-center justify-center text-on-tertiary-fixed shadow-sm"><span class="material-symbols-outlined text-3xl">share</span></div><div class="flex-grow text-left"><h4 class="font-headline-md text-on-surface">Social Post</h4><p class="font-reading-zh text-on-surface-variant text-sm">進階複習：社群貼文</p><div class="w-full bg-surface-container-high h-1.5 rounded-full mt-2"><div class="bg-tertiary h-full rounded-full w-0"></div></div></div><div class="text-right"><div class="font-label-caps text-on-surface-variant">NEW</div><div class="material-symbols-outlined text-on-surface-variant">lock</div></div></button></div>
</main>

<span class="material-symbols-outlined mb-1" data-icon="videogame_asset" data-weight="fill" style="font-variation-settings: 'FILL' 1;">videogame_asset</span>
