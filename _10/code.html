<style>
        body { background-color: #0b1326; min-height: max(884px, 100dvh); }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Glassmorphism card selection styling */
        .identity-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background: rgba(23, 31, 51, 0.4); /* surface-container with opacity */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .identity-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px -4px rgba(192, 193, 255, 0.15), 0 4px 12px -2px rgba(192, 193, 255, 0.1);
            border-color: #c0c1ff;
            background: rgba(23, 31, 51, 0.7);
        }

        .identity-card.selected {
            border-color: #44e2cd; /* secondary */
            background: rgba(19, 27, 46, 0.8); /* surface-container-low */
            box-shadow: 0 0 20px rgba(68, 226, 205, 0.2);
        }
        
        .identity-card.selected .material-symbols-outlined {
            color: #44e2cd; /* secondary */
            font-variation-settings: 'FILL' 1;
            text-shadow: 0 0 10px rgba(68, 226, 205, 0.5);
        }
        
        .identity-card.selected .card-title {
            color: #44e2cd; /* secondary */
            font-weight: 600;
        }

        .spring-bounce:active {
            transform: scale(0.9);
            transition-duration: 300ms;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile text-on-surface bg-background pt-20 pb-24">
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl border-b border-white/15 shadow-[0_0_20px_0_rgba(192,193,255,0.1)] flex justify-between items-center px-margin-mobile h-16 bg-surface/10 dark:bg-surface/10">
<span class="material-symbols-outlined text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 cursor-pointer">local_fire_department</span>
<h1 class="font-display-lg text-headline-lg-mobile bg-clip-text text-transparent bg-gradient-to-r from-primary via-tertiary to-secondary">Lumina Lexicon</h1>
<span class="material-symbols-outlined text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 cursor-pointer">account_circle</span>
</header>
<main class="w-full max-w-lg mx-auto flex flex-col h-full">
<!-- Header Section -->
<header class="text-center mb-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2 drop-shadow-[0_0_10px_rgba(192,193,255,0.3)]">
                Welcome Back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                請選擇你目前的身份，我們將為你量身打造學習內容。
            </p>
</header>
<!-- Identity Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm mb-lg" id="identityGrid">
<!-- Elementary School -->
<div class="identity-card rounded-xl p-md flex flex-col items-center justify-center text-center gap-3" data-identity="elementary" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">child_care</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">國小生</span>
</div>
<!-- Junior High -->
<div class="identity-card rounded-xl p-md flex flex-col items-center justify-center text-center gap-3 selected" data-identity="junior" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">backpack</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">國中生</span>
</div>
<!-- Senior High -->
<div class="identity-card rounded-xl p-md flex flex-col items-center justify-center text-center gap-3" data-identity="senior" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">school</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">高中生</span>
</div>
<!-- University -->
<div class="identity-card rounded-xl p-md flex flex-col items-center justify-center text-center gap-3" data-identity="university" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">account_balance</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">大學生</span>
</div>
<!-- Professional -->
<div class="identity-card rounded-xl p-md flex flex-col items-center justify-center text-center gap-3 md:col-span-2 md:w-1/2 md:mx-auto" data-identity="professional" tabindex="0">
<span class="material-symbols-outlined text-4xl text-on-surface-variant transition-colors">work</span>
<span class="card-title font-headline-md text-headline-md text-on-surface transition-colors">社會人士</span>
</div>
</div>
<!-- Action Button -->
<div class="w-full mt-auto pb-safe">
<button class="w-full h-14 font-headline-md text-headline-md rounded-xl transition-all duration-300 border bg-gradient-to-r from-primary to-secondary text-surface-container-lowest cursor-pointer hover:shadow-[0_0_20px_rgba(192,193,255,0.4)] border-transparent" id="confirmBtn">
                確認
            </button>
</div>
</main>
<!-- Bottom Nav Component -->
<nav class="fixed bottom-0 w-full z-50 backdrop-blur-xl border-t border-white/15 shadow-[0_-4px_20px_0_rgba(68,226,205,0.1)] flex justify-around items-center h-20 pb-safe px-4 bg-surface/10 dark:bg-surface/10">
<div class="flex flex-col items-center justify-center text-secondary drop-shadow-[0_0_8px_rgba(68,226,205,0.5)] cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined font-variation-settings-'FILL'-1">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined">school</span>
<span class="font-label-sm text-label-sm mt-1">Learn</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined">sports_esports</span>
<span class="font-label-sm text-label-sm mt-1">Games</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined">group</span>
<span class="font-label-sm text-label-sm mt-1">Community</span>
</div>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.identity-card');
            const confirmBtn = document.getElementById('confirmBtn');
            let selectedIdentity = null;

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove selected class from all
                    cards.forEach(c => c.classList.remove('selected'));
                    
                    // Add selected class to clicked
                    card.classList.add('selected');
                    selectedIdentity = card.dataset.identity;
                    
                    // Enable button
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('bg-outline-variant/30', 'text-on-surface-variant', 'cursor-not-allowed', 'border-white/5');
                    confirmBtn.classList.add('bg-gradient-to-r', 'from-primary', 'to-secondary', 'text-surface-container-lowest', 'cursor-pointer', 'hover:shadow-[0_0_20px_rgba(192,193,255,0.4)]', 'border-transparent');
                });
                
                // Keyboard accessibility
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        card.click();
                    }
                });
            });

            confirmBtn.addEventListener('click', () => {
                if(selectedIdentity) {
                    console.log('Confirmed identity:', selectedIdentity);
                    // Handle navigation to main app
                }
            });
        });
    </script>


</body></html>
