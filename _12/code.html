<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory Challenge - Lumina Lexicon</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#ddb7ff",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-tint": "#c0c1ff",
                        "surface-container-low": "#131b2e",
                        "secondary-fixed": "#62fae3",
                        "on-primary-container": "#0d0096",
                        "on-background": "#dae2fd",
                        "secondary-fixed-dim": "#3cddc7",
                        "on-tertiary-container": "#400071",
                        "surface-container-highest": "#2d3449",
                        "on-secondary-fixed": "#00201c",
                        "surface-bright": "#31394d",
                        "surface-container": "#171f33",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-container-high": "#222a3d",
                        "secondary-container": "#03c6b2",
                        "primary-container": "#8083ff",
                        "on-primary-fixed": "#07006c",
                        "surface": "#0b1326",
                        "primary-fixed": "#e1e0ff",
                        "on-surface": "#dae2fd",
                        "outline-variant": "#464554",
                        "tertiary-fixed": "#f0dbff",
                        "on-secondary-container": "#004d44",
                        "surface-variant": "#2d3449",
                        "inverse-on-surface": "#283044",
                        "inverse-surface": "#dae2fd",
                        "on-secondary": "#003731",
                        "inverse-primary": "#494bd6",
                        "on-secondary-fixed-variant": "#005047",
                        "primary": "#c0c1ff",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "on-tertiary": "#490080",
                        "on-primary": "#1000a9",
                        "surface-container-lowest": "#060e20",
                        "on-surface-variant": "#c7c4d7",
                        "on-tertiary-fixed-variant": "#6900b3",
                        "background": "#0b1326",
                        "on-tertiary-fixed": "#2c0051",
                        "tertiary-container": "#b76dff",
                        "tertiary-fixed-dim": "#ddb7ff",
                        "secondary": "#44e2cd",
                        "outline": "#908fa0",
                        "surface-dim": "#0b1326"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-margin": "32px",
                        "unit": "8px",
                        "card-inner-padding": "24px",
                        "container-padding": "20px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "reading-zh": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-word": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "reading-zh": ["20px", { "lineHeight": "1.6", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "fontWeight": "700" }],
                        "display-word": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
            min-height: max(884px, 100dvh);
        }
        
        .glass-card {
            background: rgba(19, 27, 46, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.outline-variant');
        }

        .level-1-card {
            background-color: theme('colors.surface-container-lowest');
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            border: 1px solid theme('colors.outline-variant');
        }

        .level-2-interactive {
            background-color: theme('colors.surface-container');
            border: 1px solid theme('colors.outline-variant');
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .level-2-interactive:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px -4px rgba(192, 193, 255, 0.15), 0 4px 12px -2px rgba(192, 193, 255, 0.1);
            border-color: theme('colors.primary');
        }

        /* Ambient animated background pattern */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: radial-gradient(circle at 15% 50%, rgba(192, 193, 255, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 85% 30%, rgba(68, 226, 205, 0.05) 0%, transparent 50%);
            opacity: 0.8;
            animation: pulse-bg 15s ease-in-out infinite alternate;
        }

        @keyframes pulse-bg {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Safe area padding for bottom nav */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        .spring-bounce:active {
            transform: scale(0.9);
            transition-duration: 300ms;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pt-16 pb-24 md:pb-0">
<div class="ambient-bg"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl border-b border-white/15 shadow-[0_0_20px_0_rgba(192,193,255,0.1)] flex justify-between items-center px-container-padding h-16 bg-surface/10 dark:bg-surface/10">
<span class="material-symbols-outlined text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 cursor-pointer">menu</span>
<h1 class="font-display-lg text-headline-lg-mobile bg-clip-text text-transparent bg-gradient-to-r from-primary via-tertiary to-secondary">Lumina Lexicon</h1>
<span class="material-symbols-outlined text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 cursor-pointer">local_fire_department</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-container-padding py-section-margin w-full max-w-5xl mx-auto mt-4">
<!-- Screen Header -->
<div class="w-full mb-section-margin text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Memory Challenge</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Reinforce yesterday's vocabulary through play.</p>
</div>
<!-- High Score Bento Box (Asymmetric placement) -->
<div class="w-full max-w-md mb-section-margin">
<div class="glass-card rounded-xl p-card-inner-padding flex items-center justify-between relative overflow-hidden shadow-[0_0_15px_rgba(192,193,255,0.1)] border-primary/20">
<div class="absolute -right-4 -top-4 w-24 h-24 bg-secondary-container rounded-full opacity-10 mix-blend-screen filter blur-xl"></div>
<div>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-1">Current High Score</h3>
<div class="font-display-word text-display-word text-secondary drop-shadow-[0_0_10px_rgba(68,226,205,0.4)] flex items-baseline gap-2">
<span>12,450</span>
<span class="font-label-caps text-label-caps text-primary font-bold">PTS</span>
</div>
</div>
<div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-tertiary flex items-center justify-center text-on-primary shadow-[0_0_15px_rgba(192,193,255,0.4)]">
<span class="material-symbols-outlined text-3xl" data-icon="emoji_events">emoji_events</span>
</div>
</div>
</div>
<!-- Mini-Game Options Grid -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-stack-gap md:gap-8">
<!-- Game 1: Letter Finder -->
<button class="level-2-interactive rounded-xl p-card-inner-padding flex flex-col items-center text-center group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<!-- Game Icon / Illustration area -->
<div class="w-32 h-32 mb-6 rounded-full bg-surface-container-high flex items-center justify-center relative shadow-inner shadow-[0_0_15px_rgba(192,193,255,0.1)]">
<div class="absolute inset-0 rounded-full border-4 border-primary/30 border-dashed animate-[spin_20s_linear_infinite]"></div>
<span class="material-symbols-outlined text-5xl text-primary drop-shadow-[0_0_8px_rgba(192,193,255,0.5)]" data-icon="find_in_page">find_in_page</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2 group-hover:text-primary transition-colors">Letter Finder</h3>
<p class="font-reading-zh text-reading-zh text-on-surface-variant mb-6">尋找遺失字母</p>
<div class="mt-auto w-full">
<div class="h-14 w-full bg-gradient-to-r from-primary to-secondary rounded-lg flex items-center justify-center font-label-caps text-label-caps text-surface-container-lowest uppercase tracking-wider group-hover:shadow-[0_0_20px_rgba(192,193,255,0.4)] transition-all">
                        Start Game
                    </div>
</div>
</button>
<!-- Game 2: Word Crush -->
<button class="level-2-interactive rounded-xl p-card-inner-padding flex flex-col items-center text-center group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-secondary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<!-- Game Icon / Illustration area -->
<div class="w-32 h-32 mb-6 rounded-full bg-surface-container-high flex items-center justify-center relative shadow-inner shadow-[0_0_15px_rgba(68,226,205,0.1)]">
<div class="absolute -inset-2 bg-secondary/10 rounded-full blur-md group-hover:blur-xl transition-all"></div>
<span class="material-symbols-outlined text-5xl text-secondary drop-shadow-[0_0_8px_rgba(68,226,205,0.5)]" data-icon="view_comfy">view_comfy</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2 group-hover:text-secondary transition-colors">Word Crush</h3>
<p class="font-reading-zh text-reading-zh text-on-surface-variant mb-6">單字消消樂</p>
<div class="mt-auto w-full">
<div class="h-14 w-full bg-gradient-to-r from-primary to-secondary rounded-lg flex items-center justify-center font-label-caps text-label-caps text-surface-container-lowest uppercase tracking-wider group-hover:shadow-[0_0_20px_rgba(192,193,255,0.4)] transition-all">
                        Start Game
                    </div>
</div>
</button>
</div>
</main>
<!-- Bottom Nav Component -->
<nav class="md:hidden fixed bottom-0 w-full z-50 backdrop-blur-xl border-t border-white/15 shadow-[0_-4px_20px_0_rgba(68,226,205,0.1)] flex justify-around items-center h-20 pb-safe px-4 bg-surface/10 dark:bg-surface/10">
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined">school</span>
<span class="font-label-caps text-label-caps mt-1">Learn</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary drop-shadow-[0_0_8px_rgba(68,226,205,0.5)] cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined font-variation-settings-'FILL'-1">sports_esports</span>
<span class="font-label-caps text-label-caps mt-1">Games</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant/70 cursor-pointer hover:text-primary transition-colors active:scale-90 duration-300 spring-bounce">
<span class="material-symbols-outlined">group</span>
<span class="font-label-caps text-label-caps mt-1">Community</span>
</div>
</nav>
<!-- Desktop SideNav/TopNav Links (Hidden on Mobile, placeholder for standard layout) -->
<div class="hidden md:flex fixed top-0 right-0 h-16 items-center pr-container-padding z-50 gap-4">
<a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors px-3 py-2" href="#">Home</a>
<a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors px-3 py-2" href="#">Learn</a>
<a class="text-primary font-label-caps text-label-caps font-bold px-3 py-2 border-b-2 border-primary" href="#">Games</a>
<a class="text-on-surface-variant font-label-caps text-label-caps hover:text-primary transition-colors px-3 py-2" href="#">Community</a>
</div>
</body></html>
