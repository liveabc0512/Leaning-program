<!-- Action Button -->
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.identity-card');
            const confirmBtn = document.getElementById('confirmBtn');
            let selectedIdentity = null;

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove selected class from all
                    cards.forEach(c => c.classList.remove('selected'));
                    
                    // Add selected class to clicked
                    card.classList.add('selected');
                    selectedIdentity = card.dataset.identity;
                    
                    // Enable button
                    confirmBtn.disabled = false;
                    confirmBtn.classList.remove('bg-outline-variant', 'text-on-surface-variant', 'cursor-not-allowed');
                    confirmBtn.classList.add('bg-primary', 'text-on-primary', 'cursor-pointer', 'hover:bg-on-primary-fixed-variant');
                });
                
                // Keyboard accessibility
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        card.click();
                    }
                });
            });

            confirmBtn.addEventListener('click', () => {
                if(selectedIdentity) {
                    console.log('Confirmed identity:', selectedIdentity);
                    // Handle navigation to main app
                }
            });
        });
    </script>
